name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Vise has no third-party dependencies, so a warning is always our own.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only actions/checkout is used. Rust comes preinstalled on the runner,
      # which keeps the workflow's own supply chain as empty as the project's.
      - name: Toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version && cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      # The examples are the repository's worked documentation; if what the
      # compiler says about them changes, that is a change worth noticing.
      - name: Examples
        run: |
          cargo build
          ./target/debug/vise check examples/greet.vise
          ./target/debug/vise check examples/payments.vise
          ./target/debug/vise run examples/greet.vise
          # The examples must be canonical: the formatter is dogfooded here.
          for f in examples/*.vise; do
            if ./target/debug/vise parse "$f" >/dev/null 2>&1; then
              ./target/debug/vise fmt "$f" --check
            fi
          done
